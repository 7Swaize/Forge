name: Release

on:
  push:
    tags: ['v*']
    
# See ref: https://github.com/ImmediatePlatform/Immediate.Handlers/blob/main/.github/workflows/release.yml
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write 
      
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            
      - name: Restore tools
        run: dotnet tool restore
        
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
        
      - name: Package
        run: dotnet pack -c Release --no-build --property:PackageOutputPath=../../nupkgs

      - name: Validate Package
        run: dotnet tool run dotnet-validate -- package local ./nupkgs/*.nupkg
  
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: NuGet push
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: 'true'
          makeLatest: 'true'